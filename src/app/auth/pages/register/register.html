<div class="register-wrapper">
  <div class="register-card">
    <h2>Registro</h2>

    <form>
      <div class="form-row">
        <label>Nombre completo*</label>
        <input
          type="text"
          [(ngModel)]="nombre"
          name="nombre"
          placeholder="Ejemplo: Andrés Gómez"
          required
        />
      </div>

      <div class="form-row">
        <label>Email*</label>
        <input
          type="text"
          [(ngModel)]="email"
          name="email"
          placeholder="correo@empresa.com"
          required
        />
      </div>

      <div class="form-row">
        <label>Contraseña*</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="********"
          required
        />
      </div>

      <div class="form-row">
        <label>Departamento*</label>
        <select
          [(ngModel)]="selectedDepto"
          name="department"
          required
        >
          <option value="" disabled selected>Selecciona un departamento</option>
          <option *ngFor="let dep of departamentos" [value]="dep">{{ dep }}</option>
        </select>
      </div>

      <div class="form-row tipo-usuario-row">
        <label>Tipo de usuario*</label>
        <div class="radio-group">
          <label class="radio-option">
            <input
              type="radio"
              name="role"
              value="USER"
              [(ngModel)]="role"
            />
            <span>Aprendiz</span>
          </label>
          <label class="radio-option">
            <input
              type="radio"
              name="role"
              value="ADMIN"
              [(ngModel)]="role"
            />
            <span>Admin</span>
          </label>
          <label class="radio-option">
            <input
              type="radio"
              name="role"
              value="INSTRUCTOR"
              [(ngModel)]="role"
            />
            <span>Instructor</span>
          </label>
        </div>
      </div>

      <div class="button-row">
        <button type="button" class="btn-primary" (click)="registrar()">
          Registrarse
        </button>
        <button type="button" class="btn-secondary" (click)="cerrarRegistro.emit()">
          Volver
        </button>
      </div>
    </form>
  </div>
</div>
