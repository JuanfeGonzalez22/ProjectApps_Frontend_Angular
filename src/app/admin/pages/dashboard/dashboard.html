<mat-sidenav-container class="admin-container">
  <!-- Sidebar -->
  <mat-sidenav mode="side" opened class="admin-sidenav">
    <div class="logo">
      <h2>LevelUpCorp</h2>
    </div>

    <nav class="menu">
      <button mat-button class="menu-item" (click)="setSection('inicio')">
        <mat-icon>home</mat-icon> Inicio
      </button>
      <button mat-button class="menu-item" (click)="setSection('usuarios')">
        <mat-icon>group</mat-icon> Usuarios
      </button>
      <button mat-button class="menu-item" (click)="setSection('cursos')">
        <mat-icon>menu_book</mat-icon> Cursos
      </button>
      <button mat-button class="menu-item" (click)="setSection('gestion-cursos')">
        <mat-icon>manage_accounts</mat-icon> Gestión de cursos
      </button>
      <button mat-button class="menu-item" (click)="setSection('gestion-modulos')">
        <mat-icon>view_module</mat-icon> Gestión de módulos
      </button>
      <button mat-button class="menu-item" (click)="setSection('reportes')">
        <mat-icon>bar_chart</mat-icon> Reportes
      </button>
      <button mat-button class="menu-item" (click)="setSection('configuracion')">
        <mat-icon>settings</mat-icon> Configuración
      </button>
    </nav>
  </mat-sidenav>

  <!-- Main content -->
  <mat-sidenav-content>
    <mat-toolbar class="admin-header">
      <span class="welcome">Bienvenido, {{ user }} 👋</span>
      <span class="spacer"></span>
      <button mat-icon-button><mat-icon>notifications</mat-icon></button>
      <button mat-icon-button><mat-icon>account_circle</mat-icon></button>
    </mat-toolbar>

    <div class="admin-content">
      <app-inicio *ngIf="section === 'inicio'"></app-inicio>
      <app-usuarios *ngIf="section === 'usuarios'"></app-usuarios>
      <app-cursos *ngIf="section === 'cursos'"></app-cursos>
      <app-gestion-modulos *ngIf="section == 'gestion-modulos' "></app-gestion-modulos>
      <app-gestion-cursos *ngIf="section === 'gestion-cursos'"></app-gestion-cursos>
      <app-reportes *ngIf="section === 'reportes'"></app-reportes>
      <app-configuracion *ngIf="section === 'configuracion'"></app-configuracion>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
