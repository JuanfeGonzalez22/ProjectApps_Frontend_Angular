<h1>Gestión de Cursos</h1>

<mat-form-field appearance="outline" class="search-bar">
  <mat-label>Buscar curso</mat-label>
  <input
    matInput
    placeholder="Ejemplo: Java Básico"
    [(ngModel)]="searchTerm"
    (input)="filtrarCursos()"
  />
  <button mat-icon-button matSuffix (click)="filtrarCursos()">
    <mat-icon>search</mat-icon>
  </button>
  <button
    mat-icon-button
    matSuffix
    *ngIf="searchTerm"
    (click)="limpiarBusqueda()"
    matTooltip="Limpiar búsqueda"
  >
    <mat-icon>close</mat-icon>
  </button>
</mat-form-field>

<!-- Mostrar si no hay resultados -->
<div *ngIf="cursosFiltrados.length === 0 && searchTerm" class="no-results">
  <p>No se encontraron cursos que coincidan con "{{ searchTerm }}"</p>
</div>

<table class="course-table" *ngIf="cursosFiltrados.length > 0">
  <thead>
    <tr>
      <th>ID</th>
      <th>Título</th>
      <th>Descripción</th>
      <th>Duración estimada</th>
      <th>Nivel</th>
    </tr>
  </thead>
  <tbody>
    <!--cursosFiltrados -->
    <tr *ngFor="let curso of cursosFiltrados">
      <td>{{ curso.id }}</td>
      <td>{{ curso.title }}</td>
      <td>{{ curso.description }}</td>
      <td>{{ formatearDuracion(curso.estimatedDuration) }}</td>
      <td>{{ curso.level }}</td>
    </tr>
  </tbody>
</table>

<div class="bottom-action">
  <button mat-raised-button color="warn" class="eliminar">Eliminar</button>
  <button mat-raised-button color="primary" class="editar">Editar</button>
  <button mat-raised-button color="accent" class="modulos" (click)="setSection('gestion-modulos')">Gestionar módulos</button>
  <button mat-raised-button class="volver" (click)="setSection('cursos')">Volver</button>
</div>
