<!-- src/app/admin/pages/dashboard/sections/gestion-evaluaciones/agregar-evaluacion/agregar-evaluacion.html -->

<div class="agregar-evaluacion-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>
        <mat-icon>add_circle</mat-icon>
        Nueva Evaluación
      </mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form #evaluacionForm="ngForm" (ngSubmit)="onSubmit()">

        <!-- Título -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Título de la evaluación</mat-label>
          <input
            matInput
            [(ngModel)]="evaluacion.title"
            name="title"
            placeholder="Ej: Examen Final de Angular"
            required
            maxlength="200">
          <mat-icon matSuffix>title</mat-icon>
        </mat-form-field>

        <!-- Módulo -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Módulo</mat-label>
          <mat-select
            [(ngModel)]="evaluacion.moduleId"
            name="moduleId"
            required>
            <mat-option [value]="0" disabled>Selecciona un módulo</mat-option>
            <mat-option *ngFor="let modulo of modulos" [value]="modulo.id">
              {{ modulo.title }}
            </mat-option>
          </mat-select>
          <mat-icon matSuffix>view_module</mat-icon>
        </mat-form-field>

        <!-- Tipo de Evaluación -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Tipo de evaluación</mat-label>
          <mat-select
            [(ngModel)]="evaluacion.type"
            name="type"
            required>
            <mat-option value="">Selecciona un tipo</mat-option>
            <mat-option *ngFor="let tipo of tiposEvaluacion" [value]="tipo">
              {{ tipo }}
            </mat-option>
          </mat-select>
          <mat-icon matSuffix>quiz</mat-icon>
        </mat-form-field>

        <!-- Puntuación Máxima -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Puntuación máxima</mat-label>
          <input
            matInput
            type="number"
            [(ngModel)]="evaluacion.maxScore"
            name="maxScore"
            placeholder="100"
            min="1"
            required>
          <mat-icon matSuffix>grade</mat-icon>
        </mat-form-field>

        <!-- Descripción (Opcional) -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Descripción (opcional)</mat-label>
          <textarea
            matInput
            [(ngModel)]="descripcion"
            name="descripcion"
            placeholder="Describe el contenido de la evaluación..."
            rows="4"
            maxlength="500"></textarea>
          <mat-icon matSuffix>description</mat-icon>
          <mat-hint align="end">{{ descripcion.length }} / 500</mat-hint>
        </mat-form-field>

        <!-- Fecha de Entrega (Opcional) -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Fecha de entrega (opcional)</mat-label>
          <input
            matInput
            type="datetime-local"
            [(ngModel)]="dueDate"
            name="dueDate">
          <mat-icon matSuffix>event</mat-icon>
        </mat-form-field>

        <!-- Botones de Acción -->
        <div class="button-group">
          <button
            mat-raised-button
            color="primary"
            type="submit"
            [disabled]="!evaluacionForm.valid || cargando">
            <mat-icon>save</mat-icon>
            {{ cargando ? 'Guardando...' : 'Crear Evaluación' }}
          </button>

          <button
            mat-raised-button
            type="button"
            (click)="onCancelar()"
            [disabled]="cargando">
            <mat-icon>cancel</mat-icon>
            Cancelar
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
