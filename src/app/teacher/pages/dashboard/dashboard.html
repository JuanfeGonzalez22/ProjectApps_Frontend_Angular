<mat-sidenav-container class="teacher-container">
  <!-- Sidebar -->
  <mat-sidenav mode="side" opened class="teacher-sidenav">
    <div class="logo">
      <h2>LevelUpCorp</h2>
    </div>

    <nav class="menu">
      <button mat-button class="menu-item" (click)="setSection('inicio')">
        <mat-icon>home</mat-icon> Inicio
      </button>
      <button mat-button class="menu-item" (click)="setSection('mis-cursos')">
        <mat-icon>menu_book</mat-icon> Mis Cursos
      </button>
      <button mat-button class="menu-item" (click)="setSection('calificar-evaluaciones')">
        <mat-icon>assignment</mat-icon> Calificar Evaluaciones
        <span *ngIf="evaluacionesPendientes > 0" class="badge">
          {{evaluacionesPendientes}}
        </span>
      </button>
      <button mat-button class="menu-item" (click)="setSection('reportes-cursos')">
        <mat-icon>bar_chart</mat-icon> Reportes de Cursos
      </button>
      <button mat-button class="menu-item" (click)="setSection('configuracion')">
        <mat-icon>settings</mat-icon> Configuración
      </button>

      <div class="logout-section">
        <button mat-button class="menu-item logout-button" (click)="logout()">
          <mat-icon>logout</mat-icon> Cerrar Sesión
        </button>
        <!-- Agrega esto después del botón de "Gestión de evaluaciones" -->
<button mat-button class="menu-item" (click)="setSection('gestion-inscripciones')">
  <mat-icon>assignment_ind</mat-icon> Gestión de Inscripciones
</button>
      </div>
    </nav>
  </mat-sidenav>

  <!-- Main content -->
  <mat-sidenav-content>
    <mat-toolbar class="teacher-header">
      <span class="welcome">Bienvenido, {{ user }} 👋</span>
      <span class="spacer"></span>
      <button mat-icon-button><mat-icon>notifications</mat-icon></button>
      <button mat-icon-button><mat-icon>account_circle</mat-icon></button>
      <button mat-icon-button (click)="logout()" matTooltip="Cerrar sesión">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    <div class="teacher-content">
      <app-inicio *ngIf="section === 'inicio'"></app-inicio>
      <app-mis-cursos *ngIf="section === 'mis-cursos'"></app-mis-cursos>
      <app-calificar-evaluaciones *ngIf="section === 'calificar-evaluaciones'"></app-calificar-evaluaciones>
      <app-reportes-cursos *ngIf="section === 'reportes-cursos'"></app-reportes-cursos>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
